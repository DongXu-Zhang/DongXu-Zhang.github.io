<aside class="profile" aria-label="Profile and contact details" itemscope itemtype="https://schema.org/Person">
  <img class="profile-photo" src="{{ site.author.avatar | relative_url }}" width="180" height="270" alt="Dongxu Zhang" itemprop="image" fetchpriority="high">
  <div class="profile-details">
    <p class="profile-role">Master's student</p><p class="profile-affiliation">Xi'an Jiaotong University</p>
    <div class="profile-links"><a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener noreferrer">Google Scholar <span aria-hidden="true">↗</span></a><a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a><a class="profile-email" href="mailto:{{ site.author.email }}" itemprop="email">{{ site.author.email }}</a></div>
    <p class="profile-location">{{ site.author.location }}</p>
  </div>
</aside>
