{% assign seo_description = page.excerpt | default: site.description | strip_html | strip_newlines | escape %}
<title>{{ site.title | escape }} · Research</title>
<meta name="description" content="{{ seo_description }}">
<meta name="author" content="{{ site.author.name | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website"><meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ site.title | escape }}"><meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
<meta name="twitter:card" content="summary"><meta name="twitter:title" content="{{ site.title | escape }}">
<meta name="twitter:description" content="{{ seo_description }}"><meta name="twitter:image" content="{{ site.author.avatar | absolute_url }}">
{% if site.google_site_verification %}<meta name="google-site-verification" content="{{ site.google_site_verification }}">{% endif %}
{% if site.bing_site_verification %}<meta name="msvalidate.01" content="{{ site.bing_site_verification }}">{% endif %}
{% if site.baidu_site_verification %}<meta name="baidu-site-verification" content="{{ site.baidu_site_verification }}">{% endif %}
